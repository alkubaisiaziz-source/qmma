<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سيت التصاميم الاختياري - قمة المعماريون</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #1c647a;
            --accent-cyan: #4eb7cd;
            --bg-gradient-start: #4eb7cd;
            --bg-gradient-end: #1c647a;
            --whatsapp-green: #25d366;
            --whatsapp-dark: #128c7e;
        }

        body {
            background-color: #3b9db4;
            background-image: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            color: white;
            font-family: 'Tajawal', sans-serif;
            min-height: 100vh;
            margin: 0;
            padding: 20px 10px;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            background: rgba(255, 255, 255, 0.12);
            padding: 25px 20px;
            border-radius: 24px;
            box-shadow: 0 15px 45px rgba(0,0,0,0.3);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            max-width: 480px;
            width: 100%;
            border: 1px solid rgba(255,255,255,0.25);
            text-align: center;
            box-sizing: border-box;
        }

        .logo-wrapper {
            background: white;
            padding: 12px 20px;
            border-radius: 16px;
            display: inline-block;
            margin-bottom: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        }

        .company-logo {
            max-width: 220px;
            width: 100%;
            height: auto;
            display: block;
        }

        h1.title {
            font-size: 24px;
            font-weight: 800;
            margin: 10px 0 5px 0;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        p.subtitle {
            font-size: 15px;
            color: #e0f7fa;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        /* قائمة الخانات */
        .slots-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .slot-card {
            background: rgba(255, 255, 255, 0.95);
            color: #263238;
            border-radius: 16px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 6px 18px rgba(0,0,0,0.15);
            transition: all 0.3s ease;
        }

        .slot-card.empty {
            background: rgba(255, 255, 255, 0.2);
            border: 2px dashed rgba(255, 255, 255, 0.7);
            color: white;
            cursor: pointer;
        }

        .slot-card.empty:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: #ffffff;
            transform: translateY(-2px);
        }

        .slot-info {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 16px;
            font-weight: 700;
            text-align: right;
            flex-grow: 1;
        }

        .slot-number {
            background: var(--primary-blue);
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 800;
            flex-shrink: 0;
        }

        .slot-card.empty .slot-number {
            background: rgba(255, 255, 255, 0.4);
            color: white;
        }

        .plus-icon {
            font-size: 24px;
            font-weight: bold;
            color: #ffffff;
            background: var(--primary-blue);
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .remove-btn {
            background: #ffebee;
            color: #d32f2f;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
            flex-shrink: 0;
        }

        .remove-btn:hover {
            background: #ffcdd2;
        }

        /* زر إضافة خانة جديدة */
        .add-more-btn {
            background: rgba(255, 255, 255, 0.25);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 12px 20px;
            border-radius: 12px;
            font-family: 'Tajawal', sans-serif;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            margin-bottom: 25px;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .add-more-btn:hover {
            background: rgba(255, 255, 255, 0.35);
        }

        /* زر الإرسال على الواتساب */
        .send-whatsapp-btn {
            background: linear-gradient(45deg, var(--whatsapp-green), var(--whatsapp-dark));
            color: white;
            border: none;
            padding: 16px;
            border-radius: 16px;
            font-family: 'Tajawal', sans-serif;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 8px 20px rgba(37, 211, 102, 0.35);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .send-whatsapp-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(37, 211, 102, 0.5);
        }

        /* اللوحة المنبثقة (Modal) */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: flex-end;
            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: #ffffff;
            color: #263238;
            border-radius: 24px 24px 0 0;
            padding: 25px 20px;
            width: 100%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
            box-sizing: border-box;
            animation: slideUp 0.3s ease-out;
            text-align: right;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 12px;
        }

        .modal-header h3 {
            margin: 0;
            font-size: 18px;
            font-weight: 800;
            color: var(--primary-blue);
        }

        .close-modal-btn {
            background: #f0f0f0;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-weight: bold;
            cursor: pointer;
            color: #666;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-item {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            padding: 14px 16px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            font-size: 15px;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .option-item:hover {
            background: #e0f7fa;
            border-color: var(--accent-cyan);
            color: var(--primary-blue);
        }

        .option-item.selected {
            background: #e8f5e9;
            border-color: #4caf50;
            opacity: 0.6;
            cursor: not-allowed;
        }

        .footer-text {
            margin-top: 25px;
            font-size: 12px;
            color: rgba(255,255,255,0.7);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- شعار الشركة -->
        <div class="logo-wrapper">
            <img class="company-logo" src="شعار قمة المعماريون الجديد.png" alt="قمة المعماريون">
        </div>

        <h1 class="title">سيت التصاميم الاختياري</h1>
        <p class="subtitle">قم بتركيب سيت التصاميم المخصص وفقاً لاحتياجاتك الخاصة، ثم أرسله إلينا لمباشرة العمل.</p>

        <!-- قائمة الخانات -->
        <div class="slots-container" id="slotsContainer">
            <!-- سيتم توليد الـ 3 خانات هنا تلقائياً -->
        </div>

        <!-- زر إضافة خانة أخرى -->
        <button class="add-more-btn" onclick="addNewSlot()">
            <span>➕ إضافة فقرة تصميم أخرى</span>
        </button>

        <!-- زر إرسال للواتساب -->
        <button class="send-whatsapp-btn" onclick="sendToWhatsApp()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="white">
                <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/>
            </svg>
            إرسال السيت على الواتساب
        </button>

        <div class="footer-text">تصميم - تنفيذ - إشراف | شركة قمة المعماريون</div>
    </div>

    <!-- اللوحة المنبثقة لاختيار الفقرات -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3>اختر فقرة التصميم</h3>
                <button class="close-modal-btn" onclick="closeModal()">✕</button>
            </div>
            <div class="options-list" id="optionsList">
                <!-- خيارات التصاميم تتولد تلقائياً -->
            </div>
        </div>
    </div>

    <script>
        // فقرات التصاميم المتاحة مأخوذة من السيتات الثلاثة
        const allDesignOptions = [
            "مخطط معماري",
            "مخطط كهرباء",
            "تصميم الواجهة",
            "مخطط صحيات",
            "مخطط ابواب وشباك",
            "مخطط 3D PLAN",
            "تصميم داخلي 5 فضاعات",
            "تصميم داخلي 10 فضاعات",
            "دليل مواد البناء",
            "جداول كميات",
            "مخطط انشائي"
        ];

        // مصفوفة الخانات تبدأ بـ 3 خانات فارغة حصراً
        let selectedSlots = [null, null, null];
        let currentActiveSlotIndex = null;

        // رسم وترتيب الخانات في الواجهة
        function renderSlots() {
            const container = document.getElementById('slotsContainer');
            container.innerHTML = '';

            selectedSlots.forEach((slotValue, index) => {
                const card = document.createElement('div');
                card.className = `slot-card ${slotValue ? '' : 'empty'}`;

                if (slotValue) {
                    // خانة ممتلئة بفقرة معينة
                    card.innerHTML = `
                        <div class="slot-info">
                            <div class="slot-number">${index + 1}</div>
                            <span>${slotValue}</span>
                        </div>
                        <button class="remove-btn" onclick="clearSlot(${index}, event)" title="إزالة">✕</button>
                    `;
                } else {
                    // خانة فارغة تفتح لوحة الاختيار عند الضغط عليها
                    card.onclick = () => openModal(index);
                    card.innerHTML = `
                        <div class="slot-info">
                            <div class="slot-number">${index + 1}</div>
                            <span>اضغط لاختيار الفقرة</span>
                        </div>
                        <div class="plus-icon">＋</div>
                    `;
                }
                container.appendChild(card);
            });
        }

        // فتح لوحة الاختيار لخانة محددة
        function openModal(index) {
            currentActiveSlotIndex = index;
            const optionsList = document.getElementById('optionsList');
            optionsList.innerHTML = '';

            allDesignOptions.forEach(option => {
                const isAlreadySelected = selectedSlots.includes(option);
                const item = document.createElement('div');
                item.className = `option-item ${isAlreadySelected ? 'selected' : ''}`;
                
                item.innerHTML = `
                    <span>${option}</span>
                    ${isAlreadySelected ? '<span style="font-size: 12px; color: #666;">(تم اختياره)</span>' : '<span style="color: var(--primary-blue); font-weight: bold;">＋</span>'}
                `;

                if (!isAlreadySelected) {
                    item.onclick = () => selectOption(option);
                }

                optionsList.appendChild(item);
            });

            document.getElementById('modalOverlay').classList.add('active');
        }

        // إغلاق اللوحة المنبثقة
        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
            currentActiveSlotIndex = null;
        }

        // اختيار فقرة وتثبيتها في الخانة
        function selectOption(option) {
            if (currentActiveSlotIndex !== null) {
                selectedSlots[currentActiveSlotIndex] = option;
                renderSlots();
                closeModal();
            }
        }

        // تفريغ خانة معينة
        function clearSlot(index, event) {
            event.stopPropagation(); // منع انتقال الضغط للبطاقة
            selectedSlots[index] = null;
            renderSlots();
        }

        // إضافة خانة جديدة فارغة عند الضغط على زر "إضافة فقرة تصميم أخرى"
        function addNewSlot() {
            selectedSlots.push(null);
            renderSlots();
        }

        // إرسال السيت الاختياري مباشرة للواتساب
        function sendToWhatsApp() {
            const filledSlots = selectedSlots.filter(item => item !== null);

            if (filledSlots.length === 0) {
                alert('يرجى اختيار فقرة تصميم واحدة على الأقل قبل الإرسال.');
                return;
            }

            let message = "مرحباً شركة قمة المعماريون 👋\n";
            message += "أود الحصول على كشف كلفة لسيت التصاميم الاختياري الخاص بي:\n\n";

            filledSlots.forEach((slot, idx) => {
                message += `${idx + 1}. ${slot}\n`;
            });

            message += "\nيرجى تزويدي بالتفاصيل والأسعار.";

            const whatsappNumber = "9647814599944";
            const encodedMessage = encodeURIComponent(message);
            const whatsappUrl = `https://wa.me/${whatsappNumber}?text=${encodedMessage}`;

            window.open(whatsappUrl, '_blank');
        }

        // تشغيل عرض الخانات عند تحميل الصفحة لأول مرة
        renderSlots();
    </script>
</body>
</html>
